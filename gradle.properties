org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Use locally-installed JDKs for Java toolchains; never auto-download (the
# official toolchain source is slow/blocked in some regions). nebula-folia-adapter
# needs Java 25; everything else uses Java 21 — both installed under /usr/lib/jvm.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=/home/kuli/jdks/jdk-25.0.3,/usr/lib/jvm/java-21-openjdk-amd64
