# Gradle 8.13 does not support Java 25 as the Gradle JVM.
# Use Java 21 for Gradle itself; the project's toolchain compiles to Java 25.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64

# Performance settings
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.vfs.watch=false

# Java toolchain paths - explicitly list local installations (comma-separated)
org.gradle.java.installations.paths=/usr/lib/jvm/java-21-openjdk-amd64,/usr/lib/jvm/java-25-openjdk-amd64,/home/kuli/jdks/jdk-25.0.3

# Configure toolchain detection
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
