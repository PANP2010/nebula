name: Nebula
version: "${version}"
main: org.nebula.plugin.NebulaPlugin
folia-supported: true
api-version: "1.21"
description: "Deterministic DAG shadow runtime for Paper and Folia"
authors:
  - NebulaArchTeam
load: STARTUP

commands:
  nebula:
    description: "Nebula plugin commands (capture, scan, status, perf)"
    usage: "/nebula <capture|scan|status|perf|help>"
    permission: nebula.use
    aliases: [neb]

permissions:
  nebula.use:
    description: "Basic Nebula command access"
    default: op
  nebula.capture:
    description: "Start/stop state capture for zero-diff verification"
    default: op
  nebula.status:
    description: "View plugin status"
    default: op
  nebula.admin:
    description: "Control experimental Nebula subsystems"
    default: op
